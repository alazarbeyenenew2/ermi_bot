<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Report Bot Admin{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
      --primary: #2563eb; --danger: #dc2626; --ok: #16a34a; --warn: #d97706;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1218; --card: #181c24; --text: #e6e8ee; --muted: #9aa3b2; --line: #2a303c; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: var(--bg); color: var(--text); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    h1 { font-size: 20px; margin: 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
                   padding: 6px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
    button:hover { filter: brightness(0.96); }
    .primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
    .ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
    input { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px;
            background: var(--card); color: var(--text); }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">{% block content %}{% endblock %}</div>
</body>
</html>
